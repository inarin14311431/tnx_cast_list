<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ACT CAST FILE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body id="act-showcase-page">
  <div id="cinematic-intro" class="cinematic-intro" aria-hidden="true">
    <div class="cinematic-intro__scan"></div>
    <div class="cinematic-intro__inner">
      <p class="cinematic-intro__overline">N◎VA MUNICIPAL DATABASE</p>

  <div id="act-showcase-status" class="showcase-loading">アクト紹介を読み込み中…</div>

      <div class="hero__content">

        <h1 id="showcase-title">ACT CAST FILE<span id="showcase-subtitle">CAST SHOWCASE</span></h1>

    <section class="showcase-end wrap" aria-label="キャスト紹介終了">
