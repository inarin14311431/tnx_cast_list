<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ACT SHOWCASE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;500;700;900&family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css-next/pages/act-showcase-entry.css?v=1">
</head>
<body id="act-showcase-page">
  <div id="cinematic-intro" class="cinematic-intro" aria-hidden="true">
    <div class="cinematic-intro__scan"></div>
    <div class="cinematic-intro__inner">
      <p class="cinematic-intro__overline">N◎VA MUNICIPAL DATABASE</p>
      <h1 class="cinematic-intro__title">ACT SHOWCASE</h1>
      <p class="cinematic-intro__sub">PUBLIC ARCHIVE ACCESS</p>
    </div>
  </div>

  <div id="act-showcase-status" class="showcase-loading">アクト紹介を読み込み中…</div>

  <div id="act-showcase-root" hidden>
    <div class="ambient-stage" aria-hidden="true">
      <span class="ambient-stage__grid"></span>
      <span class="ambient-stage__scan"></span>
      <span class="ambient-stage__flare ambient-stage__flare--cyan"></span>
      <span class="ambient-stage__flare ambient-stage__flare--pink"></span>
    </div>

    <main id="showcase-story" class="showcase-story">
      <section id="scene-opening" class="showcase-scene scene-opening" data-scene="opening" aria-labelledby="opening-act-name">
        <div class="opening-world" aria-hidden="true">
          <div class="opening-city"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
          <div class="opening-horizon"></div>
          <div class="opening-floor"></div>
          <div class="opening-door opening-door--left"><i></i></div>
          <div class="opening-door opening-door--right"><i></i></div>
        </div>
        <div class="scene-shell opening-content">
          <div class="opening-systemline"><span>N◎VA MUNICIPAL DATABASE</span><span>PUBLIC ACT FILE</span></div>
          <p class="scene-index">01 // OPENING</p>
          <p id="showcase-kicker" class="opening-kicker">PUBLIC ACT SHOWCASE</p>
          <h1 id="opening-act-name">ACT CAST FILE</h1>
          <p id="opening-subtitle" class="opening-subtitle">CAST SHOWCASE</p>
          <p id="opening-ruler" class="opening-ruler" hidden></p>
          <button type="button" class="opening-scroll"><span>SCROLL TO SHOWCASE</span><i></i></button>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="scene-shell">「トーキョーN◎VA THE AXLERATION」は有限会社ファーイースト・アミューズメント・リサーチの著作物です。</div>
    </footer>
  </div>

  <script type="module" src="./js/act-showcase-bootstrap.js?v=1"></script>
</body>
</html>
