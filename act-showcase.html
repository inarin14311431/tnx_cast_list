  <script>
  // Starts the two public data requests at once, before the style sheets below have arrived (a script waits for the style sheets above
  // it, never for those below it; the module scripts wait for all of them). The requests are cached by js/public-showcase-service.js,
  // which is taken from the modulepreload list above so that it is the very module the page loads (same URL, same cache). A failure is
  // left to the page: the cache forgets it and the page asks again and reports the error. js/act-showcase-bootstrap.js does the same
  // as a fallback.
  (() => {
    const id = new URLSearchParams(location.search).get("id");
    const link = document.querySelector('link[rel="modulepreload"][href*="/public-showcase-service.js"]');
    if (!id || !link) return;
    import(link.href).then(service => {
      const slug = service.normalizeShowcaseSlug(id);
      if (slug) for (const load of [service.loadPublicShowcase, service.loadPublicShowcaseGuests]) load(slug).catch(() => {});
    }).catch(() => {});
    // Watchdog: if the sequence has not started after 6 s (a slow line, a module that does not come), the loading screen says so and
    // offers a reload. The note is part of the loading screen: it goes away when the sequence replaces it. A failure that is known
    // earlier (a module that did not load, data that failed or timed out) is shown at once by js/act-showcase-load-error.js.
    setTimeout(() => {
      const inner = document.querySelector("#cinematic-intro .cinematic-intro__inner");
      if (!inner || document.body.classList.contains("showcase-neotokyo-intro-active")) return;
      const note = document.createElement("p");
      note.className = "cinematic-intro__slow";
      note.style.cssText = "margin:1.4em 0 0;font:700 .72rem/1.8 'Share Tech Mono',monospace;letter-spacing:.12em;opacity:.85";
      const reload = document.createElement("a");
      reload.href = location.href;
      reload.textContent = "再読み込み";
      reload.style.color = "inherit";
      note.append("読み込みに時間がかかっています。 ", reload);
      inner.append(note);
    }, 6000);
  })();
  </script>
