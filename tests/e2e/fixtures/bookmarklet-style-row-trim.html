<input id="exp.superhumanskills" value="40">
<script>
  function sumExp(){
    let total=0;
    document.querySelectorAll('#superhumanskills tbody tr').forEach(row=>{
      const index=row.id.slice('superhumanskills.'.length);
      total+=(Number(document.getElementById(`superhumanskills.${index}.expbase`)?.value)||0)*(Number(document.getElementById(`superhumanskills.${index}.level`)?.value)||0);
    });
    document.getElementById('exp.superhumanskills').value=String(total);
  }
  function levelChange(){sumExp()}
  document.addEventListener('click',event=>{
    const button=event.target.closest('input[id$=".delete"]');
    if(!button)return;
    button.closest('tr')?.remove();
    sumExp();
  });
</script>
