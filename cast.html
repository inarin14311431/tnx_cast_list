<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index, follow">
  <title>キャストデータ // N◎VA ARCHIVE</title>
  <script>
    (() => {
      const key = "tnx-cast-site-theme";
      const themes = new Set(["nova", "moon", "star", "eden", "vlad", "lutetia", "buena", "canberra", "hongkong", "fesler", "intron", "axleraters", "inagaki", "astral", "orbital", "japanese-army"]);
      let theme = "nova";
      try {
        const stored = localStorage.getItem(key);
        if (themes.has(stored)) theme = stored;
      } catch {}
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = ["intron", "orbital"].includes(theme) ? "light" : "dark";
    })();
  </script>
  <link rel="stylesheet" href="./css/cast-view-bundle.css?v=75">
  <link rel="stylesheet" href="./css/cast-theme-bundle.css?v=75" data-theme-runtime="1" data-theme-polish="1" data-theme-fixes-v3="1" data-theme-fixes-v4="1" data-theme-city-expansion="1" data-theme-canberra-yellow="1" data-theme-hongkong-fesler="1" data-theme-intron-light="1" data-theme-vlad-vampire="1" data-theme-special-brands="1" data-theme-new-worlds="1" data-theme-inagaki-gaudy="1" data-theme-inagaki-select-fix="1">
  <link rel="stylesheet" href="./css/app-chrome.css?v=1">
  <script src="./js/theme.js?v=31"></script>
</head>
<body>
  <div class="background-grid"></div><div class="scanlines"></div>
  <header class="cast-header app-header">
    <div class="cast-header__actions"><a class="cast-header__back" href="./account.html"><span>&lt; アカウントへ</span><small>RETURN TO ACCOUNT</small></a><a id="cast-edit-button" class="cast-edit-link" hidden><span>キャストを編集</span><small>EDIT CAST</small></a></div>
    <div class="cast-header__record">
      <p class="cast-header__system">N◎VA MUNICIPAL DATABASE</p>
      <p id="cast-status" class="cast-header__status">キャストデータへアクセス中…</p>
      <p id="cast-public-id" class="cast-public-id cast-header__public-id"></p>
    </div>
  </header>
  <main id="cast-content" class="cast-content" hidden>
    <section class="cast-hero">
      <div class="cast-hero__image-panel"><div class="cast-hero__image-frame"><img id="cast-image" src="./assets/placeholders/scan-failed.webp" alt=""><span class="cast-hero__image-scan"></span><div class="cast-hero__image-label">人物画像 <small>VISUAL IDENTITY</small></div></div></div>
      <div class="cast-hero__identity">
        <div class="cast-name-readings"><span id="cast-handle-kana" class="cast-handle-kana"></span><span id="cast-kana" class="cast-kana"></span></div><div class="cast-name-primary"><span id="cast-handle" class="cast-handle"></span><h1 id="cast-name" class="cast-name"></h1></div>
        <div id="cast-styles" class="cast-styles"></div>
        <section class="hero-divine-panel" aria-label="神業"><header><h2>神業 <small>DIVINE WORK</small></h2></header><div id="divine-list" class="divine-list hero-divine-list"></div></section>
        <dl class="identity-grid"><div><dt>プレイヤー</dt><dd id="cast-player"></dd></div><div><dt>所属</dt><dd id="cast-affiliation"></dd></div><div><dt>市民ランク</dt><dd id="cast-rank"></dd></div><div><dt>消費経験点</dt><dd id="cast-exp"></dd></div></dl>
        <p id="cast-summary" class="cast-summary"></p>
      </div>
    </section>
    <nav class="cast-tabs" aria-label="キャスト情報"><button class="cast-tab is-active" type="button" data-tab="session"><span>アクトデータ</span><small>ACT DATA</small></button><button class="cast-tab" type="button" data-tab="profile"><span>プロフィール</span><small>PROFILE</small></button><button class="cast-tab" type="button" data-tab="outfits"><span>アウトフィット</span><small>OUTFITS</small></button></nav>
    <section id="tab-session" class="cast-tab-panel is-active" data-panel="session"><div class="data-layout"><section class="data-panel data-panel--wide"><header class="data-panel__header"><h2>能力値／制御値 <small>ABILITY / CONTROL</small></h2></header><div id="ability-grid" class="ability-grid"></div></section><section class="data-panel data-panel--wide"><header class="data-panel__header"><h2>技能 <small>SKILLS</small></h2></header><div id="skills-container"></div></section><section class="data-panel data-panel--wide"><header class="data-panel__header"><h2>コンボ <small>COMBOS</small></h2></header><div id="combo-container" class="combo-container"></div></section></div></section>
    <section id="tab-profile" class="cast-tab-panel" data-panel="profile"><div class="data-layout"><section class="data-panel"><header class="data-panel__header"><h2>パーソナルデータ <small>PERSONAL DATA</small></h2></header><dl id="personal-data" class="profile-list"></dl></section><section class="data-panel"><header class="data-panel__header"><h2>ライフパス <small>LIFE PATH</small></h2></header><dl id="life-path" class="profile-list"></dl></section><section class="data-panel data-panel--wide"><header class="data-panel__header"><h2>プロフィール <small>PROFILE</small></h2></header><div id="profile-text" class="profile-text"></div></section></div></section>
    <section id="tab-outfits" class="cast-tab-panel" data-panel="outfits"><div id="outfit-container" class="outfit-container"></div></section>
  </main>
  <section id="cast-error" class="cast-error" hidden><p class="cast-error__code">キャストデータが見つかりません <small>CAST DATA NOT FOUND</small></p><p id="cast-error-message"></p><a href="./index.html">キャスト一覧へ戻る</a></section>
  <script src="./js/cast-cyberscan.js?v=68"></script>
  <script type="module" src="./js/cast.js?v=69"></script>
  <script src="./js/cast-fixed-general-skills.js?v=2"></script>
  <script src="./js/cast-id-display.js?v=1"></script>
  <script src="./js/cast-tabs.js?v=1"></script>
  <script type="module" src="./js/cast-ui.js?v=69"></script>
  <script type="module" src="./js/ui-v25.js?v=69"></script>
  <script type="module" src="./js/cast-style-details-v47.js?v=74"></script>
  <script type="module" src="./js/cast-style-name-multiline.js?v=1"></script>
  <script src="./js/cast-style-separators.js?v=1"></script>
  <script type="module" src="./js/cast-outfit-editorlike.js?v=69"></script>
  <script type="module" src="./js/cast-description-expand.js?v=1"></script>
  <script src="./js/cast-archetype-view.js?v=74"></script>
</body>
</html>
