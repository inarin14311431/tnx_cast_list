<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cyberpunk neon city background sample</title>
  <desc id="desc">A dark futuristic Tokyo-inspired skyline with cyan and magenta lights, a moon, mist and a perspective grid.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#02060e"/>
      <stop offset=".58" stop-color="#071322"/>
      <stop offset="1" stop-color="#09111a"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e9ff" stop-opacity="0"/>
      <stop offset=".3" stop-color="#00e9ff" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".92"/>
      <stop offset=".72" stop-color="#ff4eae" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff4eae" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07101a"/>
      <stop offset="1" stop-color="#010306"/>
    </linearGradient>
    <radialGradient id="moon" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#c8ddff"/>
      <stop offset=".62" stop-color="#7395c7"/>
      <stop offset="1" stop-color="#263752"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00e9ff" stop-opacity=".24"/>
      <stop offset="1" stop-color="#00e9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff4eae" stop-opacity=".2"/>
      <stop offset="1" stop-color="#ff4eae" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur24"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
    <pattern id="windowsCyan" width="22" height="24" patternUnits="userSpaceOnUse">
      <rect x="4" y="5" width="5" height="2" fill="#66f7ff" opacity=".42"/>
      <rect x="13" y="14" width="4" height="2" fill="#66f7ff" opacity=".24"/>
    </pattern>
    <pattern id="windowsPink" width="24" height="26" patternUnits="userSpaceOnUse">
      <rect x="5" y="6" width="5" height="2" fill="#ff76bd" opacity=".38"/>
      <rect x="14" y="16" width="4" height="2" fill="#ff76bd" opacity=".2"/>
    </pattern>
    <clipPath id="groundClip"><path d="M0 565H1600V900H0z"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="340" cy="300" rx="500" ry="330" fill="url(#cyanGlow)"/>
  <ellipse cx="1320" cy="360" rx="470" ry="340" fill="url(#pinkGlow)"/>

