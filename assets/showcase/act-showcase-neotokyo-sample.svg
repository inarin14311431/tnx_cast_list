      <rect x="504" y="334" width="58" height="186" fill="#091321"/>
      <rect x="512" y="346" width="42" height="162" fill="url(#windowsPink)"/>
    </g>

    <g>
      <rect x="1048" y="350" width="62" height="170" fill="#07111e"/>
      <rect x="1056" y="362" width="46" height="145" fill="url(#windowsCyan)"/>
      <rect x="1126" y="294" width="78" height="226" fill="#08121f"/>
      <rect x="1135" y="306" width="60" height="200" fill="url(#windowsPink)"/>
      <rect x="1224" y="216" width="88" height="304" fill="#07111f" stroke="#00e9ff" stroke-opacity=".18"/>
