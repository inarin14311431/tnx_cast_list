  <rect x="0" y="478" width="1600" height="150" fill="url(#horizon)" opacity=".18" filter="url(#blur24)"/>
  <rect x="190" y="518" width="1220" height="3" rx="2" fill="url(#horizon)" filter="url(#blur8)"/>
  <rect x="200" y="519" width="1200" height="1" fill="url(#horizon)"/>

  <g opacity=".35" fill="#a5c4d3">
