    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071127"/>
      <stop offset="1" stop-color="#020611"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5ccc"/>
      <stop offset="1" stop-color="#7ee7ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
    <pattern id="grid" width="64" height="42" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V42" fill="none" stroke="#6eb9ff" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>

