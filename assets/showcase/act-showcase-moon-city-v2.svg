<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Neon moon city background">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020714"/>
      <stop offset="0.52" stop-color="#071126"/>
      <stop offset="1" stop-color="#080d22"/>
    </linearGradient>
    <radialGradient id="horizon" cx="50%" cy="58%" r="42%">
      <stop offset="0" stop-color="#ff74db" stop-opacity=".95"/>
      <stop offset=".12" stop-color="#7d7cff" stop-opacity=".65"/>
      <stop offset=".36" stop-color="#41b9ff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#020714" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="38%" cy="36%" r="70%">
      <stop offset="0" stop-color="#bcd1ff"/>
      <stop offset=".42" stop-color="#7388c9"/>
      <stop offset=".72" stop-color="#2c3d74"/>
      <stop offset="1" stop-color="#101b3a"/>
