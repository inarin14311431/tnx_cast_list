name: Sync validation main to production branch

on:
  push:
    branches:
      - sync/test-main-20260910
    paths:
      - .github/workflows/sync-validation-main.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production sync branch
        uses: actions/checkout@v4
        with:
          path: prod
          ref: sync/test-main-20260910
          fetch-depth: 0

      - name: Checkout validation main
        uses: actions/checkout@v4
        with:
          repository: inarin14311431/tnx-cast-archive-test
          path: validation
          ref: main
          fetch-depth: 1

      - name: Mirror all non-workflow files exactly
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git' --exclude='.github/workflows' validation/ prod/
          cd prod
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -A
          git diff --cached --quiet && { echo 'No non-workflow changes'; exit 0; }
          git commit -m '検証環境 main を本番へ同期（workflow除外）'

          # Verify that any remaining difference from validation is confined to workflows.
          cp -a ../validation/.git/objects/. .git/objects/
          VALIDATION_COMMIT="$(git -C ../validation rev-parse HEAD)"
          REMAINING="$(git diff --name-only HEAD "$VALIDATION_COMMIT" || true)"
          echo "$REMAINING"
          if printf '%s\n' "$REMAINING" | grep -v '^\.github/workflows/' | grep -q .; then
            echo 'Unexpected non-workflow difference remains' >&2
            exit 1
          fi

          git push origin HEAD:sync/test-main-20260910
