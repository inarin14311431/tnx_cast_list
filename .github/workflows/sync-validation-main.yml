name: Sync validation main to production branch

on:
  push:
    branches:
      - sync/test-main-20260910
    paths:
      - .github/workflows/sync-validation-main.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production sync branch
        uses: actions/checkout@v4
        with:
          path: prod
          ref: sync/test-main-20260910
          fetch-depth: 0

      - name: Checkout validation main
        uses: actions/checkout@v4
        with:
          repository: inarin14311431/tnx-cast-archive-test
          path: validation
          ref: main
          fetch-depth: 1

      - name: Attach exact validation tree to production history
        shell: bash
        run: |
          set -euo pipefail
          cd prod
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Import the validation commit and all objects into this repository's object database.
          git fetch ../validation main
          VALIDATION_COMMIT="$(git rev-parse FETCH_HEAD)"
          VALIDATION_TREE="$(git rev-parse "${VALIDATION_COMMIT}^{tree}")"
          PARENT="$(git rev-parse HEAD)"

          NEW_COMMIT="$(printf '%s\n' '検証環境 main を本番へ完全同期' | git commit-tree "$VALIDATION_TREE" -p "$PARENT")"
          PROD_TREE="$(git rev-parse "${NEW_COMMIT}^{tree}")"

          echo "production candidate tree: $PROD_TREE"
          echo "validation tree: $VALIDATION_TREE"
          test "$PROD_TREE" = "$VALIDATION_TREE"

          git push origin "$NEW_COMMIT":refs/heads/sync/test-main-20260910
