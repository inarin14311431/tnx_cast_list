name: Security audit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit security invariants
        run: npm run audit:security
