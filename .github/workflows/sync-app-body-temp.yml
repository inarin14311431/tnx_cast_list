name: Temporary app body sync

on:
  push:
    branches:
      - sync/app-body-20260823

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          path: prod
          ref: sync/app-body-20260823
          fetch-depth: 0

      - name: Checkout validation main
        uses: actions/checkout@v4
        with:
          repository: inarin14311431/tnx-cast-archive-test
          ref: main
          path: source

      - name: Synchronize application HTML CSS JS
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete source/js/ prod/js/
          rsync -a --delete source/css-next/ prod/css-next/
          find prod -maxdepth 1 -type f -name '*.html' -delete
          cp source/*.html prod/

      - name: Commit synchronized application body
        shell: bash
        working-directory: prod
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all -- '*.html' js css-next
          if git diff --cached --quiet; then
            echo 'No application-body differences.'
            exit 0
          fi
          git commit -m 'Sync application HTML CSS JS from validation'
          git push origin HEAD:sync/app-body-20260823
