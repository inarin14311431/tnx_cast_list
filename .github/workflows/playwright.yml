name: Playwright E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: shared-db-owner-e2e
  cancel-in-progress: false

jobs:
  public-smoke:
    name: Public and smoke E2E
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run public and smoke tests
        run: npm run e2e:ci-public
        env:
          E2E_CAST_ID: ${{ secrets.E2E_CAST_ID }}
      - name: Upload public Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-public
          path: playwright-report/
          retention-days: 14

  authenticated-editor:
    name: Authenticated editor E2E
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run authenticated editor tests
        run: npm run e2e:ci-editor
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_CAST_ID: ${{ secrets.E2E_CAST_ID }}
      - name: Upload editor Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-editor
          path: playwright-report/
          retention-days: 14

  mobile:
    name: Mobile E2E
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Run mobile tests
        run: npm run e2e:ci-mobile
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_CAST_ID: ${{ secrets.E2E_CAST_ID }}
      - name: Upload mobile Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-mobile
          path: playwright-report/
          retention-days: 14
