name: One-shot sync verified cache/version changes

on:
  push:
    branches:
      - release/cache-policy-shared-version-20260911
    paths:
      - .github/workflows/one-shot-sync-cache-version.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync verified files from staging
        shell: bash
        run: |
          set -euo pipefail
          source_commit="74fccf8bbe65ab225b4ce0be7359559d5700c7fd"
          files=(
            "config/editor-cache-policy.json"
            "scripts/editor-cache-audit-lib.mjs"
            "scripts/audit-editor-cache-policy.mjs"
            "package.json"
            ".github/workflows/regression.yml"
            "js/character-sheet-jsonp-canonical.js"
            "js/outfit-ofc-adapter.js"
            "js/outfit-ofc-utils.js"
            "js/outfit-pc-field-policy.js"
            "js/outfit-view-model.js"
            "js/sheet-import-outfit-compat.js"
            "js/sheet-mobile-outfit-model.js"
            "js/sheet-new-character-state.js"
            "tests/legacy-outfit-import-table-contract.test.mjs"
            "tests/outfit-import-transfer-contract.test.mjs"
            "tests/outfit-pc-field-policy-contract.test.mjs"
          )
          for path in "${files[@]}"; do
            mkdir -p "$(dirname "$path")"
            curl --fail --silent --show-error --location \
              "https://raw.githubusercontent.com/inarin14311431/tnx-cast-archive-test/${source_commit}/${path}" \
              --output "$path"
          done
          npm run audit:cache
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          if git diff --cached --quiet; then
            echo "No verified differences to sync."
            exit 0
          fi
          git commit -m "Sync verified cache policy and shared module versions"
          git push origin HEAD
