name: Promote validation to production once

on:
  push:
    paths:
      - '.github/workflows/promote-validation-once.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout validation
        uses: actions/checkout@v4
        with:
          repository: inarin14311431/tnx-cast-archive-test
          ref: main
          path: _validation
      - name: Sync validation runtime
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_validation/' \
            --exclude 'tests/' \
            --exclude 'package.json' \
            --exclude 'README.md' \
            --exclude 'DYNAMIC_SHOWCASE_SETUP.md' \
            _validation/ ./
          rm -rf _validation
          rm -f .github/workflows/promote-validation-once.yml
      - name: Commit production sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No runtime changes to promote.'
            exit 0
          fi
          git commit -m 'Promote validated runtime to production'
          git push origin HEAD:main
