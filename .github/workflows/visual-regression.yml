name: Visual Regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compare:
    name: Compare reference screenshots
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    timeout-minutes: 15
    steps:
      - name: Checkout production
        uses: actions/checkout@v7
      - name: Checkout approved visual reference
        uses: actions/checkout@v7
        with:
          repository: inarin14311431/tnx-cast-archive-test
          ref: visual-regression-baseline
          path: .visual-reference
      - name: Sync visual test contract
        run: |
          test -f .visual-reference/playwright.visual.config.js
          test -d .visual-reference/tests/visual
          rm -rf tests/visual
          cp -R .visual-reference/tests/visual tests/visual
          cp .visual-reference/playwright.visual.config.js playwright.visual.config.js
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Compare screenshots
        run: npm run test:visual:production
      - name: Upload visual report and image diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-report
          path: |
            playwright-report-visual/
            test-results/visual/
          if-no-files-found: ignore
          retention-days: 14
