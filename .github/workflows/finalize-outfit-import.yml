name: Finalize outfit import
on:
  push:
    paths:
      - '.github/workflows/finalize-outfit-import.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and bump cache
        run: |
          node --check js/sheet-import-outfit-compat.js
          sed -i 's/sheet-import-outfit-compat.js?v=9/sheet-import-outfit-compat.js?v=11/g' sheet.html
      - name: Commit cache bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sheet.html
          git commit -m 'Bump legacy outfit importer cache to v11' || exit 0
          git push
