name: Regression checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: npm run check:js
      - name: Audit module dependency graph
        run: npm run audit:modules
      - name: Audit runtime integrity
        run: npm run audit:integrity
      - name: Audit CSS architecture
        run: npm run audit:css
      - name: Audit theme system
        run: npm run audit:themes
      - name: Audit PC editor runtime
        run: npm run audit:sheet
      - name: Audit public cast runtime
        run: npm run audit:cast
      - name: Audit troop runtime
        run: npm run audit:troop
      - name: Audit mobile editor runtime
        run: npm run audit:mobile
      - name: Audit security invariants
        run: npm run audit:security
      - name: Audit migration history
        run: npm run audit:migrations
      - name: Audit quality gate contract
        run: npm run audit:quality
      - name: Audit JavaScript reachability
        run: npm run audit:js-reachability
      - name: Audit CI coverage contract
        run: npm run audit:ci
      - name: Report sheet DOM ownership
        run: npm run report:sheet-ownership
      - name: Report cast DOM ownership
        run: npm run report:cast-ownership
      - name: Run Node regression tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee node-regression-test.log
      - name: Upload Node regression test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-regression-test-log
          path: node-regression-test.log
          if-no-files-found: ignore
          retention-days: 7
