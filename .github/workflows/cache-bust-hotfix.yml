name: Cache bust hotfix

on:
  push:
    branches:
      - hotfix/cache-bust-theme-experience-20260821

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh cache keys
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name '*.html' -print0 | xargs -0 sed -i 's#css-next/index.css?v=43#css-next/index.css?v=44#g'
          sed -i 's#js/experience.js?v=99#js/experience.js?v=100#g' sheet.html
          sed -i 's#sheet-mobile-app.js?v=9#sheet-mobile-app.js?v=10#g' sheet-mobile.html
          sed -i 's#sheet-mobile-header-exp.js?v=20260821-1#sheet-mobile-header-exp.js?v=20260821-2#g' js/sheet-mobile-app.js
          rm -f .github/workflows/cache-bust-hotfix.yml
      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Bust production theme and experience caches'
          git push
