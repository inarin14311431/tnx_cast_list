name: Sync verified test environment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-test-to-production.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout verified test source
        run: git clone --depth 1 https://github.com/inarin14311431/tnx-cast-archive-test.git /tmp/tnx-test

      - name: Sync verified application files
        shell: bash
        run: |
          set -euo pipefail

          rsync -a /tmp/tnx-test/js/ ./js/
          rsync -a /tmp/tnx-test/css-next/ ./css-next/

          cp /tmp/tnx-test/account.html ./account.html
          cp /tmp/tnx-test/cast.html ./cast.html
          cp /tmp/tnx-test/sheet.html ./sheet.html

          mkdir -p supabase
          cp /tmp/tnx-test/supabase/26_combo_multi_suit.sql ./supabase/26_combo_multi_suit.sql
          cp /tmp/tnx-test/supabase/README.md ./supabase/README.md

          # Remove patch files and helper scripts retired in the verified test environment.
          rm -f \
            css-next/editor/combo-card-hover.css \
            css-next/pages/account-metadata.css \
            css-next/pages/cast-combo-header-width.css \
            css-next/pages/cast-cyber-effects-v2.css \
            css-next/pages/cast-divine-layout.css \
            css-next/pages/cast-export-hover.css \
            css-next/pages/cast-profile-lines.css \
            css-next/pages/combo-suits.css \
            js/account-navigation-fix.js \
            js/account-search-reset.js

          # This workflow is intentionally one-shot.
          rm -f .github/workflows/sync-test-to-production.yml

      - name: Commit production sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Production is already synchronized.'
            exit 0
          fi
          git commit -m 'Sync verified test environment to production'
          git push origin HEAD:main
