name: Sync verification PR361
on:
  push:
    branches:
      - sync/verification-pr361-20260914
permissions:
  contents: write
jobs:
  sync:
    if: "github.event.head_commit.message != 'Sync verification PR 361 files'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/verification-pr361-20260914
      - name: Copy verified files
        shell: bash
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/inarin14311431/tnx-cast-archive-test/9dfef202ff5a52580bac20aeca0907066ad58bc6'
          curl -fsSL "$base/cast.html" -o cast.html
          curl -fsSL "$base/js/cast-mobile.js" -o js/cast-mobile.js
          curl -fsSL "$base/js/cast.js" -o js/cast.js
          curl -fsSL "$base/sheet.html" -o sheet.html
          curl -fsSL "$base/tests/combo-use-count-labels.test.mjs" -o tests/combo-use-count-labels.test.mjs
          grep -q '使用回数 <small>USES</small>' sheet.html
          grep -q '使用回数 <small>USES</small>' js/cast.js
          grep -q '使用回数　${limit}回' js/cast-mobile.js
          ! grep -q '1アクト使用回数' js/cast.js
          ! grep -q '1アクト使用上限' sheet.html
      - name: Commit sync
        shell: bash
        run: |
          if git diff --quiet -- cast.html js/cast-mobile.js js/cast.js sheet.html tests/combo-use-count-labels.test.mjs; then
            echo 'No sync changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cast.html js/cast-mobile.js js/cast.js sheet.html tests/combo-use-count-labels.test.mjs
          git commit -m 'Sync verification PR 361 files'
          git push origin HEAD:sync/verification-pr361-20260914
