name: One-shot sync validation PRs 354-357

on:
  push:
    branches:
      - sync/validation-354-357-20260914
    paths:
      - .github/workflows/one-shot-sync-validation-354-357.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync verified files from validation
        shell: bash
        run: |
          set -euo pipefail
          source_commit="c64e03c230933c75971055cc2f35e1dcf8b0906a"
          files=(
            "js/character-sheet-compare-matching.js"
            "js/character-sheet-compare-service.js"
            "tests/character-sheet-compare-matching.test.mjs"
            "cast.html"
            "css-next/pages/cast-entry.css"
            "css-next/pages/cast-outfit-column-widths.css"
            "js/cast-outfits.js"
            "js/cast-view-definitions.js"
            "tests/cast-character-sheet-link-placement.test.mjs"
            "tests/cast-desktop-layout-contract.test.mjs"
            "tests/cast-outfit-column-widths.test.mjs"
            "css-next/components/character-sheet-compare.css"
            "css-next/pages/sheet-entry.css"
            "tests/character-sheet-zero-diff-actions.test.mjs"
            "js/sheet-character-sheet-compare.js"
            "tests/character-sheet-compare-contract.test.mjs"
          )
          for path in "${files[@]}"; do
            mkdir -p "$(dirname "$path")"
            curl --fail --silent --show-error --location \
              "https://raw.githubusercontent.com/inarin14311431/tnx-cast-archive-test/${source_commit}/${path}" \
              --output "$path"
          done
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          if git diff --cached --quiet; then
            echo "No verified differences to sync."
            exit 0
          fi
          git commit -m "Sync validation PRs #354-#357"
          git push origin HEAD
