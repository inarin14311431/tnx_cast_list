<!doctype html>
<html lang="ja">
<head>
  <script src="./js/css-next-theme.js"></script>
  <link rel="stylesheet" href="./css-next/index.css?v=26" data-css-system="next">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>パスワード再設定 // N◎VA CAST ARCHIVE</title>
</head>
<body data-page="password-reset.html">
  <div class="background-grid"></div><div class="scanlines"></div>
  <header class="auth-header">
    <a class="app-back-link" href="./login.html"><span>&lt; ログインへ</span><small>RETURN TO LOGIN</small></a>
    <p>N◎VA MUNICIPAL DATABASE</p>
    <h1><span>認証情報再設定</span><small>CREDENTIAL RECOVERY</small></h1>
  </header>
  <main class="auth-layout">
    <section class="auth-terminal">
      <section class="auth-panel is-active">
        <h2>新規パスワード登録 <small>SET NEW PASSWORD</small></h2>
        <p class="auth-panel__lead">新しいパスワードを入力してください。</p>
        <form id="password-reset-form" class="auth-form">
          <label><span>新しいパスワード <small>NEW PASSWORD</small></span><input id="new-password" type="password" autocomplete="new-password" minlength="8" required></label>
          <label><span>パスワード確認 <small>PASSWORD CONFIRMATION</small></span><input id="new-password-confirmation" type="password" autocomplete="new-password" minlength="8" required></label>
          <button type="submit"><span>認証情報を更新</span><small>UPDATE CREDENTIALS</small></button>
        </form>
      </section>
      <div id="auth-message" class="auth-message" aria-live="polite"></div>
    </section>
  </main>
  <script type="module" src="./js/password-reset.js?v=1"></script>
</body>
</html>
